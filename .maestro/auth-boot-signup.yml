appId: com.alegarn.WoIstWaldoProject
---
# Smoke: boot on a clean app state, generate unique signup credentials, and
# verify the account can be created without colliding with existing rows.
# Signup credentials are generated at runtime by scripts/generate-signup-credentials.js
# which reads SIGNUP_EMAIL_PREFIX, SIGNUP_EMAIL_DOMAIN, SIGNUP_PASSWORD, SIGNUP_USERNAME_PREFIX.
# Env vars: pass individually via -e KEY=VALUE on the CLI (Maestro 2.3.0).
# Example: maestro test .maestro/auth-boot-signup.yml -e SIGNUP_EMAIL_PREFIX=e2e.signup -e SIGNUP_EMAIL_DOMAIN=woistwaldo.test -e SIGNUP_PASSWORD=E2eSignup123! -e SIGNUP_USERNAME_PREFIX=e2e_signup

- launchApp:
    appId: com.alegarn.WoIstWaldoProject
- waitForAnimationToEnd
- tapOn:
    text: Reload
    optional: true
- tapOn:
    text: Go To Home
    optional: true
- tapOn:
    text: Continue
    optional: true
- tapOn:
    text: Go home
    optional: true
- tapOn:
    id: guess-path.header.back
    optional: true
- tapOn:
    id: guess-path.button.home
    optional: true
- tapOn:
    text: Close
    optional: true
- tapOn:
    id: home.tutorial-modal.close
    optional: true
- tapOn:
    id: home.header.logout
    optional: true
- extendedWaitUntil:
    visible:
      id: auth.input.email
    timeout: 10000
- assertVisible:
    id: auth.input.email
- assertVisible:
    id: auth.input.password
- assertVisible:
    id: auth.button.login-submit
- tapOn:
    id: auth.button.switch-to-signup
- extendedWaitUntil:
    visible:
      id: auth.button.signup-submit
    timeout: 5000
- assertVisible:
    id: auth.input.confirm-email
- assertVisible:
    id: auth.input.confirm-password
- assertVisible:
    id: auth.input.username
- runScript: scripts/generate-signup-credentials.js
- tapOn:
    id: auth.input.email
- inputText: ${output.signup.email}
- tapOn:
    id: auth.input.confirm-email
- inputText: ${output.signup.email}
- tapOn:
    id: auth.input.password
- inputText: ${output.signup.password}
- tapOn:
    id: auth.input.confirm-password
- inputText: ${output.signup.password}
- tapOn:
    id: auth.input.username
- inputText: ${output.signup.username}
- hideKeyboard
- tapOn:
    id: auth.button.signup-submit
- extendedWaitUntil:
    visible:
      id: home.tutorial-modal.close
    timeout: 20000
- tapOn:
    id: home.tutorial-modal.close
    optional: true
- assertVisible:
    id: home.button.hide
- assertVisible:
    id: home.button.guess
- assertVisible:
    id: home.button.ranking