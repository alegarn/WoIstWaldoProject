appId: com.alegarn.WoIstWaldoProject
---
# Return to HomeScreen from any authenticated screen.
# Handles: ResultScreen, GuessScreen, GuessFeedScreen, RankingScreen,
# GuessPathScreen, and any modal.
# Ends with the home screen ready for the next flow.

# Result screen → tap "Go to Home"
- runFlow:
    when:
      visible:
        id: result.button.home
    commands:
      - tapOn:
          id: result.button.home
      - extendedWaitUntil:
          visible:
            id: home.button.ranking
          timeout: 10000

# GuessScreen with tutorial overlay still up → dismiss it first
- runFlow:
    when:
      visible:
        id: game.instructions.guess.overlay
    commands:
      - tapOn:
          id: game.instructions.guess.overlay
      - waitForAnimationToEnd

# GuessScreen → system back to GuessFeedScreen
- runFlow:
    when:
      visible:
        id: game.picture.guess-surface
    commands:
      - back
      - waitForAnimationToEnd

# GuessFeedScreen → native header back
- runFlow:
    when:
      visible:
        id: guess-feed.button.back
    commands:
      - tapOn:
          id: guess-feed.button.back
      - waitForAnimationToEnd

# Ranking screen → system back
- runFlow:
    when:
      visible:
        id: ranking.screen
    commands:
      - back
      - waitForAnimationToEnd

# GuessPathScreen → E2E home button
- runFlow:
    when:
      visible:
        id: guess-path.button.home
    commands:
      - tapOn:
          id: guess-path.button.home
      - waitForAnimationToEnd

# GuessPathScreen → native header back
- runFlow:
    when:
      visible:
        id: guess-path.header.back
    commands:
      - tapOn:
          id: guess-path.header.back
      - waitForAnimationToEnd

# Dismiss tutorial modal on home
- runFlow:
    when:
      visible:
        id: home.tutorial-modal.close
    commands:
      - tapOn:
          id: home.tutorial-modal.close
      - waitForAnimationToEnd

# Confirm home screen ready
- extendedWaitUntil:
    visible:
      id: home.button.ranking
    timeout: 10000
