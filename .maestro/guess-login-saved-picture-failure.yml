appId: com.alegarn.WoIstWaldoProject
---
# Incorrect-guess flow. Assumes the app is already launched, connected to Metro,
# logged in, and sitting on HomeScreen. Run auth-boot-login.yml ONCE first, then
# run hide-login-save-picture.yml to create the saved payload this flow asserts.
# Do NOT re-launch the app in this flow (it breaks the Metro connection).
# In E2E mode, long-pressing the guess surface (game.picture.guess-surface) selects
# a deterministic wrong location away from the saved point.
# Env vars: pass via -e KEY=VALUE (Maestro 2.3.0; --env-file is NOT supported).
# Example: maestro test .maestro/guess-login-saved-picture-failure.yml
- extendedWaitUntil:
    visible:
      id: home.button.guess
    timeout: 10000
- assertVisible:
    id: home.button.guess
- assertVisible:
    id: home.button.hide
- tapOn:
    id: home.button.guess
- extendedWaitUntil:
    visible:
      id: guess-path.category.card.all
    timeout: 10000
- tapOn:
    id: guess-path.category.card.all
- extendedWaitUntil:
    visible:
      id: guess-path.button.start
    timeout: 10000
- tapOn:
    id: guess-path.button.start
- extendedWaitUntil:
    visible:
      id: guess-path.card.1
    timeout: 10000
- assertVisible:
    id: guess-path.card.1
- assertVisible:
    id: guess-path.card.saved
- swipe:
    elementIds:
      - guess-path.card.1
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: game.instructions.guess.overlay
    timeout: 10000
- tapOn:
    id: game.instructions.guess.overlay
- extendedWaitUntil:
    visible:
      id: game.picture.guess-surface
    timeout: 10000
- longPressOn:
    id: game.picture.guess-surface
- extendedWaitUntil:
    visible:
      id: game.picture.clear-guess
    timeout: 5000
- tapOn:
    id: game.picture.clear-guess
- extendedWaitUntil:
    visible:
      id: game.picture.guess-modal.confirm
    timeout: 5000
- tapOn:
    id: game.picture.guess-modal.confirm
- extendedWaitUntil:
    visible:
      id: result.screen.failure
    timeout: 10000
- assertVisible:
    id: result.screen.failure
- assertVisible:
    id: result.button.home
- assertVisible:
    id: result.button.retry
- assertVisible:
    id: result.button.next
- tapOn:
    id: result.button.next
- extendedWaitUntil:
    visible:
      id: game.instructions.guess.overlay
    timeout: 10000
- runFlow: "_shared/return_home.yaml"