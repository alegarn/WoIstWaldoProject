appId: com.alegarn.WoIstWaldoProject
---
# Login-first guess flow. It expects a previously saved E2E hidden-guess payload
# and fails fast if the saved description is not present on the guess screen.
# Env vars: pass individually via -e KEY=VALUE on the CLI (Maestro 2.3.0).
# Example: maestro test .maestro/guess-login-saved-picture-success.yml -e LOGIN_EMAIL=a@a.com -e LOGIN_PASSWORD=aaaaaa

- runFlow: auth-boot-login.yml
- tapOn:
    id: home.button.guess
- extendedWaitUntil:
    visible:
      id: guess-path.button.start
    timeout: 10000
- tapOn:
    id: guess-path.button.start
- extendedWaitUntil:
    visible:
      id: guess-path.card.1
    timeout: 10000
- assertVisible:
    id: guess-path.card.1
- assertVisible:
    id: guess-path.card.saved
- tapOn:
    id: guess-path.card.open.1
- extendedWaitUntil:
    visible:
      id: game.instructions.guess.overlay
    timeout: 10000
- tapOn:
    id: game.instructions.guess.overlay
- extendedWaitUntil:
    visible:
      id: game.picture.guess-surface
    timeout: 10000
- tapOn:
    id: game.picture.guess-surface
- extendedWaitUntil:
    visible:
      id: game.picture.clear-guess
    timeout: 5000
- tapOn:
    id: game.picture.clear-guess
- extendedWaitUntil:
    visible:
      id: game.picture.guess-modal.confirm
    timeout: 5000
- tapOn:
    id: game.picture.guess-modal.confirm
- extendedWaitUntil:
    visible:
      id: result.screen.success
    timeout: 10000
- assertVisible:
    id: result.screen.success
- assertVisible:
    id: result.button.home
- assertVisible:
    id: result.button.another
- runFlow: "_shared/return_home.yaml"