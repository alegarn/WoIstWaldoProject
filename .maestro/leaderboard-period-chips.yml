appId: com.alegarn.WoIstWaldoProject
---
# Public ranking period chips (plan 05 T5a, plan 06 me-anchored composition).
# Assumes the session phase already ran (auth-boot-login.yml) and the app sits
# on HomeScreen, like the other feature flows. Requires EXPO_PUBLIC_E2E_MODE=true
# at bundle start/build.
# CAVEAT: hide-to-guess-to-result.yml documents a pre-existing app crash when
# navigating into RankingScreen from the guess path (expo-file-system
# File.exists on a non-file URI); this flow enters from HomeScreen instead.
# The shim is period-aware AND me-anchored: rows are top 3 + the me-block far
# below with an ellipsis separator row when a rank gap opens. Me-card rank per
# chip: all -> #12 (separator visible), week -> #6 (separator visible),
# day -> #2 (me inside the top block, no separator).
- assertVisible:
    id: home.button.ranking
- tapOn:
    id: home.button.ranking
- extendedWaitUntil:
    visible:
      id: ranking.screen.board.total
    timeout: 10000
- assertVisible:
    id: ranking.screen.period.all
- assertVisible:
    id: ranking.screen.period.week
- assertVisible:
    id: ranking.screen.period.day
- assertVisible:
    text: "You are #12"
- assertVisible:
    id: ranking.separator
- tapOn:
    id: ranking.screen.period.week
- extendedWaitUntil:
    visible:
      text: "You are #6"
    timeout: 10000
- assertVisible:
    id: ranking.screen.board.total
- assertVisible:
    id: ranking.separator
- tapOn:
    id: ranking.screen.period.day
- extendedWaitUntil:
    visible:
      text: "You are #2"
    timeout: 10000
- assertNotVisible:
    id: ranking.separator
- tapOn:
    id: ranking.screen.period.all
- extendedWaitUntil:
    visible:
      text: "You are #12"
    timeout: 10000
- runFlow: "_shared/return_home.yaml"
