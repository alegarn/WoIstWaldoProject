appId: com.alegarn.WoIstWaldoProject
---
# Public ranking period chips (plan 05 T5a, contract v3 bidirectional window).
# Assumes the session phase already ran (auth-boot-login.yml) and the app sits
# on HomeScreen, like the other feature flows. Requires EXPO_PUBLIC_E2E_MODE=true
# at bundle start/build.
# CAVEAT: hide-to-guess-to-result.yml documents a pre-existing app crash when
# navigating into RankingScreen from the guess path (expo-file-system
# File.exists on a non-file URI); this flow enters from HomeScreen instead.
# The shim is period-aware AND me-anchored: the initial envelope is the
# contiguous me-window only (no top block), so no separator is visible until
# the user pages toward a rank gap. Me-card rank per chip: all -> #12,
# week -> #6, day -> #2.
- assertVisible:
    id: home.button.ranking
- tapOn:
    id: home.button.ranking
- extendedWaitUntil:
    visible:
      id: ranking.screen.board.total
    timeout: 10000
- assertVisible:
    id: ranking.screen.period.all
- assertVisible:
    id: ranking.screen.period.week
- assertVisible:
    id: ranking.screen.period.day
- assertVisible:
    text: "You are #12"
- tapOn:
    id: ranking.screen.period.week
- extendedWaitUntil:
    visible:
      text: "You are #6"
    timeout: 10000
- assertVisible:
    id: ranking.screen.board.total
- tapOn:
    id: ranking.screen.period.day
- extendedWaitUntil:
    visible:
      text: "You are #2"
    timeout: 10000
- assertNotVisible:
    id: ranking.separator
- tapOn:
    id: ranking.screen.period.all
- extendedWaitUntil:
    visible:
      text: "You are #12"
    timeout: 10000
# Contract v3: one directional (scroll-down) page load. The shim serves rows
# 15-20 past the all-period me-window (10-14), so rank 15 must appear.
- scrollUntilVisible:
    element:
      id: ranking.row.15.rank
    direction: DOWN
    timeout: 20000
- runFlow: "_shared/return_home.yaml"
