appId: com.alegarn.WoIstWaldoProject
---
# Full login-first deterministic E2E journey using the saved hide payload bridge.
# The app itself must already have been started or built with EXPO_PUBLIC_E2E_MODE=true.
# Env vars: pass individually via -e KEY=VALUE on the CLI (Maestro 2.3.0).
# Example: maestro test .maestro/hide-to-guess-to-result.yml -e LOGIN_EMAIL=a@a.com -e LOGIN_PASSWORD=aaaaaa

- runFlow: hide-login-save-picture.yml
- assertVisible:
    id: home.button.hide
- assertVisible:
    id: home.button.guess
- tapOn:
    id: home.button.guess
- extendedWaitUntil:
    visible:
      id: guess-path.category.card.all
    timeout: 10000
- tapOn:
    id: guess-path.category.card.all
- extendedWaitUntil:
    visible:
      id: guess-path.button.start
    timeout: 10000
- tapOn:
    id: guess-path.button.start
- extendedWaitUntil:
    visible:
      id: guess-path.card.1
    timeout: 10000
- assertVisible:
    id: guess-path.card.1
- assertVisible:
    id: guess-path.card.saved
- swipe:
    elementIds:
      - guess-path.card.1
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: game.instructions.guess.overlay
    timeout: 10000
- tapOn:
    id: game.instructions.guess.overlay
- extendedWaitUntil:
    visible:
      id: game.picture.guess-surface
    timeout: 10000
- assertVisible:
    id: game.picture.guess-surface
- tapOn:
    id: game.picture.guess-surface
- extendedWaitUntil:
    visible:
      id: game.picture.clear-guess
    timeout: 5000
- tapOn:
    id: game.picture.clear-guess
- extendedWaitUntil:
    visible:
      id: game.picture.guess-modal.confirm
    timeout: 5000
- tapOn:
    id: game.picture.guess-modal.confirm
# Non-blocking success: SuccessOverlay flashes, next card loads in place
# (no ResultScreen / ShowSuccess on success). Score is buffered, not rated.
- extendedWaitUntil:
    visible:
      id: guess.success.overlay
    timeout: 10000
- assertVisible:
    id: guess.success.overlay
# Overlay is pointerEvents:none and animates ~0.6-0.9s, so the picture surface
# underneath stays reachable. Assert it next with NO intervening fixed wait.
- assertVisible:
    id: game.picture.guess-surface
# Card-advance signal: the just-guessed (saved) card's description must be gone.
- assertNotVisible:
    text: "A scenic spot used for deterministic e2e guess flows."
# Ranking navigation omitted: RankingScreen hits a pre-existing, unrelated app
# crash (expo-file-system File.exists called with a non-file URI from
# utils/imagesRequests.js). Re-add the ranking tail once that app bug is fixed.
- runFlow: "_shared/return_home.yaml"