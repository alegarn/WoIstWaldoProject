appId: com.alegarn.WoIstWaldoProject
---
# Full login-first deterministic E2E journey using the saved hide payload bridge.
# The app itself must already have been started or built with EXPO_PUBLIC_E2E_MODE=true.

- runFlow: hide-login-save-picture.yml
- assertVisible:
    id: home.button.hide
- assertVisible:
    id: home.button.guess
- tapOn:
    id: home.button.guess
- extendedWaitUntil:
    visible:
      id: guess-path.button.start
    timeout: 10000
- tapOn:
    id: guess-path.button.start
- extendedWaitUntil:
    visible:
      id: guess-path.card.1
    timeout: 10000
- assertVisible:
    id: guess-path.card.1
- assertVisible:
    id: guess-path.card.saved
- tapOn:
    id: guess-path.card.open.1
- extendedWaitUntil:
    visible:
            id: game.instructions.guess.overlay
    timeout: 10000
- tapOn:
        id: game.instructions.guess.overlay
- extendedWaitUntil:
    visible:
      id: game.picture.guess-surface
    timeout: 10000
- assertVisible:
    id: game.picture.guess-surface
- tapOn:
    id: game.picture.guess-surface
- extendedWaitUntil:
    visible:
      id: game.picture.clear-guess
    timeout: 5000
- tapOn:
    id: game.picture.clear-guess
- extendedWaitUntil:
    visible:
      id: game.picture.guess-modal.confirm
    timeout: 5000
- tapOn:
    id: game.picture.guess-modal.confirm
- extendedWaitUntil:
    visible:
      id: result.screen.success
    timeout: 10000
- assertVisible:
    id: result.screen.success
- assertVisible:
    id: result.button.home
- tapOn:
    id: result.button.home
- extendedWaitUntil:
    visible:
      id: home.button.ranking
    timeout: 10000
- tapOn:
    id: home.button.ranking
- extendedWaitUntil:
    visible:
      id: ranking.table
    timeout: 10000
- assertVisible:
    id: ranking.screen
- assertVisible:
    id: ranking.table
- assertVisible:
    id: ranking.row.1.name
- assertVisible: ${RANKING_ROW_1_NAME}