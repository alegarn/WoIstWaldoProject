appId: com.alegarn.WoIstWaldoProject
---
# Shape-mode guess success flow. Assumes the app is already launched, connected
# to Metro, logged in, and sitting on HomeScreen. Run auth-boot-login.yml ONCE
# first, then run hide-shape-to-guess.yml to create the shape saved payload this
# flow asserts. Do NOT re-launch the app in this flow (it breaks the Metro
# connection).
# Expects the saved shape-mode E2E hidden-guess payload (guess-path.card.saved)
# and fails fast if it is not present. In E2E mode, tapping the guess surface
# seeds the deterministic HIT outline and auto-opens the confirm modal.
# Env vars: none.
# Example: maestro test .maestro/guess-shape-success.yml
- extendedWaitUntil:
    visible:
      id: home.button.guess
    timeout: 10000
- assertVisible:
    id: home.button.guess
- assertVisible:
    id: home.button.hide
- tapOn:
    id: home.button.guess
- extendedWaitUntil:
    visible:
      id: guess-path.category.card.all
    timeout: 10000
- tapOn:
    id: guess-path.category.card.all
- extendedWaitUntil:
    visible:
      id: guess-path.button.start
    timeout: 10000
- tapOn:
    id: guess-path.button.start
- extendedWaitUntil:
    visible:
      id: guess-path.card.1
    timeout: 10000
- assertVisible:
    id: guess-path.card.1
- assertVisible:
    id: guess-path.card.saved
- swipe:
    elementIds:
      - guess-path.card.1
    direction: RIGHT
- extendedWaitUntil:
    visible:
      id: game.instructions.guess.overlay
    timeout: 10000
- tapOn:
    id: game.instructions.guess.overlay
- extendedWaitUntil:
    visible:
      id: game.picture.shape-surface
    timeout: 10000
- assertVisible:
    id: game.picture.shape-surface
# Shape cards lose the swipe affordances while the classifier is suppressed;
# assert the explicit testID'd controls rendered instead.
- assertVisible:
    id: game.picture.shape-enigma
- assertVisible:
    id: game.picture.shape-exit
# E2E shim: surface tap seeds the HIT outline and auto-opens the confirm modal.
- tapOn:
    id: game.picture.guess-surface
- extendedWaitUntil:
    visible:
      id: game.picture.guess-modal.confirm
    timeout: 5000
- assertVisible:
    text: "Confirm outline"
- tapOn:
    id: game.picture.guess-modal.confirm
# Non-blocking success: SuccessOverlay flashes, next card loads in place
# (no ResultScreen / ShowSuccess on success). Score is buffered, not rated.
- extendedWaitUntil:
    visible:
      id: guess.success.overlay
    timeout: 10000
- assertVisible:
    id: guess.success.overlay
# Overlay is pointerEvents:none and animates ~0.6-0.9s, so the picture surface
# underneath stays reachable. Assert it next with NO intervening fixed wait —
# the surface is tappable/assertable while the overlay is still on screen.
- assertVisible:
    id: game.picture.guess-surface
# Card-advance signal: the just-guessed (saved) card's description must be gone,
# proving setParams advanced to the next card in place.
- assertNotVisible:
    text: "A scenic spot used for deterministic e2e guess flows."
- runFlow: "_shared/return_home.yaml"
